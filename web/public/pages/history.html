<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>History</title>
    <!-- materialize icons, css & js -->
    <link rel="stylesheet" type="text/css" href="https://js.api.here.com/v3/3.1/mapsjs-ui.css" />
    <link type="text/css" href="/css/materialize.min.css" rel="stylesheet">
    <link rel="website icon" type="png" href="../img/web_icon.png">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
    <script type="text/javascript" src="https://js.api.here.com/v3/3.1/mapsjs-core.js"></script>
    <script type="text/javascript" src="https://js.api.here.com/v3/3.1/mapsjs-service.js"></script>
    <script type="text/javascript" src="https://js.api.here.com/v3/3.1/mapsjs-ui.js"></script>
    <script type="text/javascript" src="https://js.api.here.com/v3/3.1/mapsjs-mapevents.js"></script>
    <link type="text/css" href="/css/styles.css" rel="stylesheet">
    <script type="text/javascript" src="/js/materialize.min.js"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FFE1C4">
</head>
<body class="grey lighten-4">
  <!-- top nav -->
  <nav class="z-depth-0">
    <div class="nav-wrapper container">
      <a href="/">Caracter</a>
      <span class="right grey-text text-darken-1">
        <i class="material-icons sidenav-trigger" data-target="side-menu">menu</i>
      </span>
    </div>
  </nav>

  <!-- side nav -->
  <ul id="side-menu" class="sidenav side-menu">
    <li><a class="subheader">Caracter</a></li>
    <li><a href="/" class="waves-effect">Home</a></li>
    <li><a href="/pages/login.html" class="waves-effect">Login</a></li>
    <li><div class="divider"></div></li>
    </li>
</ul>

  <!-- recipes -->
  <div class="history container black-text text-darken-1">
    <h6 class="center">History</h6>
    <div class="card-panel-history white row">
        <div class="history-panel">
        </div>
    </div>
</div>
<div class="history-info">
    <div class ="card-panel recipe white row" style="display: none;">
        <div class="image"><i class="material-icons medium">directions_car</i></div>
        <div class="info">
            <div>Car Name : ${CAR_ID.car_name}</div>
        </div>
        <div class="speed center-align">
            <h6 class="center-align"> Average Speed</h6>
            <div class="center-align"> ${avg_speed} km/h</div>
            <div>KM drive : 2.5 km</div>
        </div>
    </div>
    <div class="body white row" style="display: none;"> 
    <h6>Report Karakter</h6>
    <div class="white row row-vertical-center chart-history">
        <div class="col s6">
            <canvas id="myChart" style="
            height: 1%;
            width: 1%; 
            justify-content: center;
            align-items: center;"></canvas>
        </div>
        <div class="col s6">
            <div class="chart-legend-wrapper">
            <div class="chart-legend">
            </div>
            </div>
        </div>
        </div>
        </div>
    <!-- MAPS -->
    <div class="maps container black-text">
      <div class="gps-maps-here-history container">
        <div id="maphistory"></div>
        </div>
        <div class="container">
            <div class="row">
            </div>
        </div>
    </div> 
</div>
               
  <script src="/js/app.js"></script>
  <script type="module" src="/js/history.js"></script>
  <script src="/js/ui.js"></script>
</body>
</html>
