<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Login</title>
  <!-- materialize icons, css & js -->
  <link type="text/css" href="/css/materialize.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="website icon" type="png" href="../img/web_icon.png">
  <link type="text/css" href="/css/styles.css" rel="stylesheet">
  <script type="text/javascript" src="/js/materialize.min.js"></script>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FFE1C4">
</head>
<body>
  <body class="grey lighten-4">
    <!-- top nav -->
    <nav class="z-depth-0">
        <div class="nav-wrapper container">
        <a href="/">Caracter</a>
        <span class="right grey-text text-darken-1">
            <i class="material-icons sidenav-trigger" data-target="side-menu">menu</i>
        </span>
        </div>
    </nav>
    <ul id="side-menu" class="sidenav side-menu">
      <li><a class="subheader">Caracter</a></li>
      <li><a href="/" class="waves-effect">Home</a></li>
      <li><a href="/pages/login.html" class="waves-effect">Login</a></li>
      <li><div class="divider"></div></li>
      </li>
  </ul> 
    <div class="contain-sign row" style="display:none;" id="signup">
      <h1 class="form-title">Register</h1>
          <form class="col s12" method="post" action="" id="MainForm">
            <div id="signUpMessage" class="messageDiv" style="display:none;"></div>
            <div class="row">
              <div class="input-field col s6">
                <i class="material-icons prefix">account_circle</i>
                <input placeholder="First Name" id="fName" type="text" class="validate">
                <label for="fName">First Name</label>
              </div>
              <div class="input-field col s6">
                <input placeholder="Last Name" id="lName" type="text" class="validate">
                <label for="lName">Last Name</label>
              </div>
            </div>
            <div class="row">
              <div class="input-field col s12">
                <i class="material-icons prefix">directions_car</i>
                <input placeholder="ex. Avanza, Ayla ,ect." id="Car_name" type="text" class="validate">
                <label for="Car_name">Car Name</label>
              </div>
            </div>
            <div class="row">
              <div class="input-field col s12">
                <i class="material-icons prefix">dialpad</i>
                <input placeholder="PIN of the Device" id="ID_uno" type="text" class="validate" required>
                <label for="ID_uno">ID of the Device</label>
              </div>
            </div>
            <div class="row">
              <div class="input-field col s12">
                <i class="material-icons prefix">mail_outline</i>
                <input placeholder="Email" id="rEmail" type="email" class="validate">
                <label for="rEmail">Email</label>
              </div>
            </div>
            <div class="row">
              <div class="input-field col s12">
                <i class="material-icons prefix">lock_outline</i>
                <input placeholder="Password" id="rPassword" type="password" class="validate">
                <label for="rPassword">Password</label>
              </div>
            </div>
            <button class="btn" id="submitSignUp" >Sign Up</button>
          </form>
      <div class="links">
        <a id="signInButton" class="waves-effect">Log in</a>
      </div>
    </div>
    <div class="contain-sign row" id="signIn">
      <h1 class="form-title">Login</h1>
      <form method="post" action="">
        <div id="signInMessage" class="row messageDiv" style="display:none;"></div>
        <div class="row">
          <div class="input-field col s20">
            <i class="material-icons prefix">mail_outline</i>
            <input id="email" type="email" class="validate">
            <label for="email">Email</label>
          </div>
        </div>
        <div class="row">
          <div class="input-field col s20">
            <i class="material-icons prefix">lock_outline</i>
            <input id="password" type="password" class="validate">
            <label for="password">Password</label>
          </div>
        </div>
       <button  class="btn"  id="submitSignIn">Login</button>
      </form>
      <div class="links">
        <a id="signUpButton" class="waves-effect">Sign Up</a>
      </div>
    </div>
    <script src="/js/app.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
</body>
</html>
