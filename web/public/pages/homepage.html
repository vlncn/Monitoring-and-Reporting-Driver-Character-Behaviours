<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Caracter</title>
  <!-- materialize icons, css & js -->
  <link rel="stylesheet" type="text/css" href="https://js.api.here.com/v3/3.1/mapsjs-ui.css" />
  <link type="text/css" href="/css/materialize.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="website icon" type="png" href="../img/web_icon.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
  <script type="text/javascript" src="https://js.api.here.com/v3/3.1/mapsjs-core.js"></script>
  <script type="text/javascript" src="https://js.api.here.com/v3/3.1/mapsjs-service.js"></script>
  <script type="text/javascript" src="https://js.api.here.com/v3/3.1/mapsjs-ui.js"></script>
  <script type="text/javascript" src="https://js.api.here.com/v3/3.1/mapsjs-mapevents.js"></script>
  <link type="text/css" href="/css/styles.css" rel="stylesheet">
  <script type="text/javascript" src="/js/materialize.min.js"></script>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FFE1C4">
</head>
<body class="grey lighten-4">

  <!-- top nav -->
  <nav class="z-depth-0">
    <div class="nav-wrapper container">
      <a href="/pages/homepage.html">Caracter</a>
      <span class="right grey-text text-darken-1">
        <i class="material-icons sidenav-trigger" data-target="side-menu">menu</i>
      </span>
    </div>
  </nav>

  <!-- side nav -->
  <ul id="side-menu" class="sidenav side-menu">
    <li><a class="subheader">Caracter</a></li>
    <li><a href="/" class="waves-effect">Home</a></li>
    <li><a href="/pages/login.html" class="waves-effect">Login</a></li>
    <li><div class="divider"></div></li>
    </li>
</ul>

  <!-- recipes -->
  <div class="cars container grey-text text-darken-1">
    <h6 class="center">Cars List</h6>
    <div class="card-panel recipe white row">
      <i class="material-icons medium center">directions_car</i>
      <div class="cars-details">
        <div class="cars-name">-------</div>
        <div class="cars-character">Character : -------</div>
      </div>
      <div class="cars-speed">- km/h</div>
      <div></div>
      <div></div>
      <div class="cars-tools">
        <img src="../img/bat.png">
        <span class="cars-battery_level"> -- % </span>
        <img src="../img/sig.png">
        <span class="cars-cell_str"> -- dBm </span></div>
    </div>
  </div>
  <!-- REPORT -->
  <div class="report container black-text">
    <ul class="collapsible">
        <li class="report-1">
            <div class="collapsible-header"><i class="material-icons">filter_drama</i>Report</div>
            <div class="collapsible-body white"> 
              <div class="row row-vertical-center">
                <div class="col s6">
                  <canvas id="myChart" style="
                  height: 100%;
                  width: 100%; 
                  justify-content: center;
                  align-items: center;"></canvas>
                </div>
                <div class="col s6">
                  <div class="chart-legend-wrapper">
                    <div class="chart-legend">
                    </div>
                  </div>
                </div>
              </div>
            <div class="collection">
              <a href="#!" class="collection-item"><span id="TotalViolation" class="badge">0</span>Jumlah Pelanggaran</a>
            </div>
          </div>
        </li>
    </ul>
  </div>
  <!-- MAPS -->
  <div class="maps container black-text">
    <h6 class="center">Location</h6>
    <div class="center cars-update-time">Last Updated : ----/--/-- --:--:--</div>
  </div>
  <div class="gps-maps-here container">
    <div id="map"></div>
    </div>
    <div class="container">
        <div class="row">
        </div>
    </div>
  <script src="/js/app.js"></script>
  <script type="module" src="/js/db.js"></script>
  <script src="/js/map.js"></script>
  <script src="/js/ui.js"></script>
</body>
</html>
